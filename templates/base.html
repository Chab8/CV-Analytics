<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}CV Analytics{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
    <script defer src="{{ url_for('static', filename='js/modoOscuro.js') }}"></script>
    {% block head %}{% endblock %}
</head>

<body class="{% block body_class %}{% endblock %}">
    <script>try { if (localStorage.getItem("theme") === "dark") document.body.classList.add("dark-mode") } catch (e) { }</script>

    <header class="header">
        <a href="{{ url_for('index') }}" aria-label="CV Analytics, ir al inicio">
            <img src="{{ url_for('static', filename='icons/CV Analytics logo.svg') }}" alt="CV Analytics"
                class="logo logo-light">
            <img src="{{ url_for('static', filename='icons/cv analytics logo white.svg') }}" alt=""
                class="logo logo-dark">
        </a>
        <nav class="nav" aria-label="Principal">
            <a href="{{ url_for('subir') }}" {% if request.endpoint=='subir' %} aria-current="page" {% endif %}>Analizar
                CV</a>
            <a href="{{ url_for('crear_cv.wizard') }}" {% if request.endpoint=='crear_cv.wizard' %} aria-current="page"
                {% endif %}>Crear CV</a>
            <a href="{{ url_for('index') }}#como">Cómo funciona</a>
            <button class="modo-oscuro-btn" type="button" aria-label="Cambiar entre modo claro y oscuro">
                <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
                </svg>
                <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="4" />
                    <path
                        d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
                </svg>
            </button>
        </nav>
    </header>

    {% block content %}{% endblock %}

    <footer class="footer">
        <div class="wrap footer-in">
            <img src="{{ url_for('static', filename='icons/CV Analytics logo.svg') }}" alt="CV Analytics"
                class="logo logo-light">
            <img src="{{ url_for('static', filename='icons/cv analytics logo white.svg') }}" alt=""
                class="logo logo-dark">
            <a href="https://www.linkedin.com/company/cv-analytics/" target="_blank" rel="noopener">LinkedIn</a>
            <small>© 2026 CV Analytics</small>
        </div>
    </footer>
    {% block scripts %}{% endblock %}
</body>

</html>
